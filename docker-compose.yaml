services:
  ci4-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - D:/Kerjaan Ngoding/cafeid:/var/www/html  # Pastikan volume ini mengarah ke root proyek Anda
    networks:
      - ci4-network

  ci4-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ci4_db
    ports:
      - "3306:3306"
    networks:
      - ci4-network

networks:
  ci4-network:
    driver: bridge
